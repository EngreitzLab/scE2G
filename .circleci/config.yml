# Use the latest 2.1 version of CircleCI pipeline process engine.
# See: https://circleci.com/docs/configuration-reference
#
# Every push always runs both tier-1 unit tests and the full E2E test --
# see TESTING.md for what each tier covers. The only thing that varies is
# whether the conda env cache is used:
#
# - Regular pushes: restore_cache/save_cache (keyed on a checksum of the
#   three env files that feed rule conda envs) skips re-solving envs that
#   haven't changed. save_cache always runs afterward, so the cache stays
#   fresh even right after a cache miss.
# - Nightly builds: a CircleCI "Scheduled Pipeline" trigger (Project
#   Settings > Triggers), set to run against the desired branch with
#   pipeline parameter `nightly: true`, skips the cache restore entirely so
#   the env solve always starts from scratch -- this is what catches
#   upstream conda/bioconda/pip drift (a dependency publishing a breaking
#   version bump) that a cache hit would otherwise mask.
version: 2.1

parameters:
  nightly:
    type: boolean
    default: false

jobs:
  build-and-test:
    docker:
      - image: condaforge/mambaforge
    # CircleCI will report the results back to your VCS provider.
    resource_class: large
    steps:
      - checkout
      - run: git submodule sync --recursive
      - run: git submodule update --init --recursive
      - run:
          name: Install basic OS pkgs
          command: apt-get update && apt-get -y install curl vim jq
      # - run:
      #     name: Run Linter (python black)
      #     command: |
      #       mamba install black
      #       black . --check
      - run:
          name: Install run_snakemake env
          no_output_timeout: 30m
          command: |
            mamba env create -f workflow/envs/run_snakemake.yml
      - when:
          condition:
            not: << pipeline.parameters.nightly >>
          steps:
            - restore_cache:
                keys:
                  - rule-conda-envs-v1-{{ checksum "workflow/envs/sc_e2g.yml" }}-{{ checksum "ENCODE_rE2G/workflow/envs/encode_re2g.yml" }}-{{ checksum "ENCODE_rE2G/ABC/workflow/envs/abcenv.yml" }}
      - run:
          name: Build rule conda envs (sc_e2g, encode_re2g, abcenv)
          no_output_timeout: 30m
          command: |
            conda run -n run_snakemake snakemake -j1 --use-conda --conda-create-envs-only --configfile tests/config/test_config.yml
      - save_cache:
          key: rule-conda-envs-v1-{{ checksum "workflow/envs/sc_e2g.yml" }}-{{ checksum "ENCODE_rE2G/workflow/envs/encode_re2g.yml" }}-{{ checksum "ENCODE_rE2G/ABC/workflow/envs/abcenv.yml" }}
          paths:
            - .snakemake/conda
      - run:
          name: Run unit tests
          no_output_timeout: 5m
          command: |
            conda run -n run_snakemake snakemake -j1 --use-conda test_python_unit test_r_unit --configfile tests/config/test_config.yml
      - run:
          name: Run full E2E test
          no_output_timeout: 45m
          command: |
            ulimit -n 65536
            conda run -n run_snakemake pytest -s -n 1 tests/test_sce2g_apply.py

workflows:
  my-workflow:
    jobs:
      - build-and-test
