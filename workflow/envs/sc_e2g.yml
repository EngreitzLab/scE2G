name: sc_e2g
channels:
  - bioconda
  - conda-forge
  - defaults
  - r
dependencies:
  - bedtools=2.29.2
  - tabix
  - ucsc-bedgraphtobigwig
  - click
  - csvtk
  - numpy
  - pandas
  - anndata>=0.11  # python anndata: reticulate backend for r-anndata's read_h5ad() (self-contained env, no external RETICULATE_PYTHON). Floor avoids conda resolving an ancient anndata (imports removed pandas.core.index) under the scikit-learn=1.2.1 pin; >=0.11 resolves to 0.12.x w/ numpy<2, py3.11 -- verified reads the HEP3B h5ad.
  - python>=3.6
  - pigz
  - snakemake>=7.0
  - scikit-learn=1.2.1  # Must match with ENCODE-rE2G version
  - scipy
  - wget
  - pip
  - rust>=1.78  # cargo>=1.78 required for fast_kendall_sc's Cargo.lock v4 (via maturin)
  - pip:
    - fast_kendall_sc @ git+https://github.com/EngreitzLab/fast_kendall_sc.git@v1.0.0
  - r-base
  - r-r.utils
  - r-data.table
  - r-dplyr
  - r-plotly
  - r-rmarkdown
  - r-DT
  - r-tidyverse
  - r-ggpubr
  - r-ggcorrplot
  - r-foreach
  - r-doParallel
  - r-Signac
  - r-Seurat
  - r-Rcpp
  - r-anndata
  - seaborn
  - matplotlib
  - bioconductor-genomicranges
  - bioconductor-genomation
  - r-codetools
