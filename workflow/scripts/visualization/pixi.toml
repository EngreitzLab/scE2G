[project]
name = "scE2G-visualization"
version = "0.1.0"
description = "R environment for scE2G cross-cell-type comparison and visualization scripts"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[system-requirements]
linux = "3.10.0"
libc = { family = "glibc", version = "2.17" }

[dependencies]
"r-base" = ">=4.3"
"r-data.table" = "*"
"r-ggplot2" = "*"
"r-optparse" = "*"
"r-scales" = "*"
"r-patchwork" = "*"
"r-ggrepel" = "*"
"bioconductor-genomicranges" = "*"
"bioconductor-rtracklayer" = "*"
"r-r.utils" = "*"
